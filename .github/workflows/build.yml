name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true
      - name: Unit tests
        run: go test ./internal/config ./internal/auth ./internal/java ./internal/launch ./internal/version ./internal/download ./internal/boot

  linux:
    name: Linux
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true
      - name: Install Qt 6
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config ca-certificates \
            qt6-base-dev qt6-base-dev-tools qt6-declarative-dev \
            libgl1-mesa-dev libvulkan-dev \
            qml6-module-qtquick \
            qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts \
            qml6-module-qtquick-templates \
            qml6-module-qtquick-window \
            qml6-module-qtqml \
            qml6-module-qtqml-workerscript
      - name: Cache compile
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: linux-miqt-${{ hashFiles('go.sum') }}
          restore-keys: linux-miqt-
          save-always: true
      - name: Download modules
        timeout-minutes: 5
        run: |
          echo "proxy ${GOPROXY:-default}"
          go mod download -x
      - name: Build
        timeout-minutes: 45
        run: bash .github/scripts/stage-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mclauncher-linux-amd64
          path: dist/mclauncher-linux-amd64
          if-no-files-found: error

  windows:
    name: Windows
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-declarative
            mingw-w64-ucrt-x86_64-qt6-shadertools
            mingw-w64-ucrt-x86_64-qt6-tools
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true
      - name: Keep Defender off the module cache
        shell: pwsh
        run: |
          $paths = @(
            "$env:USERPROFILE\go",
            "$env:LOCALAPPDATA\go-build",
            "${{ github.workspace }}"
          )
          Add-MpPreference -ExclusionPath $paths
      - name: Cache compile
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\go-build
            ~\go\pkg\mod
          key: windows-miqt-${{ hashFiles('go.sum') }}
          restore-keys: windows-miqt-
          save-always: true
      - name: Download modules
        timeout-minutes: 5
        shell: pwsh
        run: |
          go version
          go env GOPATH GOMODCACHE
          go mod download -x
      - name: Build
        timeout-minutes: 50
        shell: msys2 {0}
        run: bash .github/scripts/stage-windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mclauncher-windows-amd64
          path: dist/mclauncher-windows-amd64.exe
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/mclauncher-linux-amd64/mclauncher-linux-amd64
            dist/mclauncher-windows-amd64/mclauncher-windows-amd64.exe
